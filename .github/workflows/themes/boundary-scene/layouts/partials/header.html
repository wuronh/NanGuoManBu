<header class="sticky top-0 z-50 backdrop-blur-md bg-slate-50/80 dark:bg-darkbg/80 border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-5xl mx-auto px-5 py-4 flex justify-between items-center">
    <a href="{{ .Site.BaseURL }}" class="text-xl font-serif font-semibold text-tech dark:text-humanity tracking-wide">{{ .Site.Title }}</a>
    <nav class="hidden md:flex gap-8 text-sm">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" class="link-hover py-1">{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="flex items-center gap-4">
      <button id="themeToggle" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800 transition">
        <i class="fa fa-moon-o dark:hidden"></i>
        <i class="fa fa-sun-o hidden dark:block"></i>
      </button>
      <button class="md:hidden" id="mobileMenuBtn">
        <i class="fa fa-bars text-lg"></i>
      </button>
    </div>
  </div>
  <div id="mobileMenu" class="hidden md:hidden border-t border-slate-200 dark:border-slate-800 px-5 py-3 space-y-3 text-sm">
    {{ range .Site.Menus.main }}
    <a href="{{ .URL }}" class="block py-1">{{ .Name }}</a>
    {{ end }}
  </div>
</header>
